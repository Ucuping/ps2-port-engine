# The Windows build, kept working while this fork moves the engine to other
# platforms: the runtime, the host, the GPU renderer and their tests, a port
# linked from a dispatch table of no game (tests/ci), and the toolchain's tests
# - which on Windows, with MSVC present, include the lifter's compiled checks.
# MSVC, with AVX2 on and off. No game material is needed or used.
#
# The engine is checked out into engine/, where a game repository keeps it:
# some toolchain tests find the engine as <repository>/engine, and the source
# hygiene test globs engine/**.
name: windows

on:
  push:
    branches: [macos-arm64]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    name: MSVC, AVX2 ${{ matrix.avx2 }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        avx2: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: engine
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Generated sources of a port of no game
        run: python engine/tests/ci/stub_generated.py build/stub-generated

      # Built as port.py builds a game's port (engine/tools/toolchain.py):
      # Visual Studio's CMake and Ninja under vcvars - with MSVC's own
      # compiler here (PS2_COMPILER), not clang-cl - so that path is checked
      # too. A file of compiled VU code takes the compiler 2 GB and more.
      - name: Build the runtime, the host, the renderer, their tests and the port
        env:
          PS2_COMPILER: msvc
        run: >-
          python engine/tools/toolchain.py build engine/tests/ci/stub_game/port
          build/stub-port build/stub-generated --avx2 ${{ matrix.avx2 }} --jobs 3

      - name: Runtime tests
        run: ./build/stub-port/ps2host/ps2rt_tests.exe

      - name: Host tests (the GPU's skip without a Vulkan device)
        run: ./build/stub-port/ps2host/ps2host_tests.exe

      - name: Platform tests (fibers and their float control, waits, guarded reads)
        run: ./build/stub-port/ps2host/ps2platform_tests.exe

      - name: Toolchain tests
        run: python -m unittest discover -s engine/tests -v
